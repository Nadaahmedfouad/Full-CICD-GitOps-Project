apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: full-cicd-gitops
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Nadaahmedfouad/Full-CICD-GitOps-Project
    targetRevision: main
    path: kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: full-cicd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
