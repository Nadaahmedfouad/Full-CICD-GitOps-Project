
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ivolvedb
  namespace: full-cicd

spec:
  serviceName: ivolvedbsvc
  replicas: 1

  selector:
    matchLabels:
      app: ivolvedb

  template:
    metadata:
      labels:
        app: ivolvedb

    spec:
      nodeSelector:
        project: ivolve

      tolerations:
        - key: workload
          operator: Equal
          value: ivolveApp
          effect: NoSchedule

      containers:
        - name: mysql
          image: mysql:8.0

          ports:
            - containerPort: 3306
              name: mysql

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ivolvesecret
                  key: MYSQL_ROOT_PASSWORD

            - name: MYSQL_DATABASE
              value: ivolve

            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: ivolvecm
                  key: DB_USER

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ivolvesecret
                  key: DB_PASSWORD

          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql

  volumeClaimTemplates:
    - metadata:
        name: mysql-storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ""
        volumeName: fullproject-mysql-pv
        resources:
          requests:
            storage: 1Gi

