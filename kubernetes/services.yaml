
apiVersion: v1
kind: Service
metadata:
  name: ivolveappsvc
  namespace: full-cicd
spec:
  type: ClusterIP
  selector:
    app: ivolveapp
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: ivolvedbsvc
  namespace: full-cicd
spec:
  clusterIP: None
  selector:
    app: ivolvedb
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
